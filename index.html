<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Market Plus | Juguetes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --primario: #6366f1;
            --secundario: #a5b4fc;
            --fondo: #f9fafb;
            --texto: #1f2937;
            --verde: #22c55e;
            --blanco: #ffffff;
            --gris: #e5e7eb;
            --badge: #fde68a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--fondo);
            color: var(--texto);
        }

        /* HEADER */
        header {
            background: linear-gradient(90deg, var(--primario), var(--secundario));
            padding: 20px;
        }

        .header-content {
            max-width: 1100px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        header h1 {
            margin: 0;
            color: var(--blanco);
            font-size: 30px;
        }

        nav {
            display: flex;
            gap: 15px;
        }

        nav a {
            text-decoration: none;
            background-color: rgba(255,255,255,0.25);
            color: var(--blanco);
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 14px;
            transition: 0.2s;
        }

        nav a:hover {
            background-color: var(--blanco);
            color: var(--primario);
        }

        /* CONTENEDOR */
        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 15px;
        }

        .titulo-seccion {
            text-align: center;
            font-size: 28px;
            margin-bottom: 35px;
            color: var(--primario);
        }

        /* GRID */
        .productos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 30px;
        }

        .producto {
            background-color: var(--blanco);
            border-radius: 18px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.06);
            transition: transform 0.2s;
            position: relative;
        }

        .producto:hover {
            transform: translateY(-6px);
        }

        /* BADGE */
        .badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background-color: var(--badge);
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 12px;
            font-weight: bold;
        }

        /* IMAGEN */
        .producto img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .producto h3 {
            font-size: 16px;
            margin-bottom: 10px;
        }

        /* BOTÓN */
        .btn-comprar {
            display: inline-block;
            margin-top: 10px;
            background-color: var(--verde);
            color: var(--blanco);
            padding: 12px 22px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s, transform 0.2s;
        }

        .btn-comprar:hover {
            background-color: #16a34a;
            transform: scale(1.05);
        }

        footer {
            margin-top: 60px;
            text-align: center;
            padding: 20px;
            font-size: 14px;
            color: #6b7280;
        }
    </style>
</head>
<body>

<header>
    <div class="header-content">
        <h1>Market Plus</h1>
        <nav>
            <a href="https://marketplus20000-bit.github.io/tienda-de-productos-oline/">Inicio</a>
            <a href="#">Contacto</a>
        </nav>
    </div>
</header>

<div class="container">
    <h2 class="titulo-seccion">Juguetes</h2>

    <div class="productos">

        <div class="producto">
            <span class="badge">Menudeo / Mayoreo</span>
            <img src="https://i.ibb.co/yBp3k2yN/Whats-App-Image-2025-12-28-at-12-31-36-PM.jpg" alt="Juguete">
            <h3>Juguete Infantil</h3>
            <a href="https://buy.stripe.com/test_14A5kDdRR5Kxbkrf559bO00" class="btn-comprar" target="_blank">
                Comprar ahora
            </a>
        </div>

    </div>
</div>

<footer>
    © 2025 Market Plus · Todos los derechos reservados
</footer>

</body>
</html>
