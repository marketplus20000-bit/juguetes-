<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Market Plus | Juguetes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --primario: #6366f1;
            --secundario: #a5b4fc;
            --fondo: #f1f5f9;
            --texto: #1f2937;
            --verde: #22c55e;
            --azul: #3b82f6;
            --blanco: #ffffff;
            --gris: #e5e7eb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--fondo);
            color: var(--texto);
        }

        /* HEADER */
        header {
            background: linear-gradient(90deg, var(--primario), var(--secundario));
            padding: 20px;
        }

        .header-content {
            max-width: 1100px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        header h1 {
            margin: 0;
            color: var(--blanco);
            font-size: 30px;
            font-weight: bold;
        }

        nav {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        nav a {
            text-decoration: none;
            background-color: rgba(255,255,255,0.25);
            color: var(--blanco);
            padding: 10px 18px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        nav a:hover {
            background-color: var(--blanco);
            color: var(--primario);
        }

        /* CONTENEDOR */
        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 15px;
        }

        .titulo-seccion {
            text-align: center;
            font-size: 30px;
            margin-bottom: 40px;
            color: var(--primario);
        }

        /* GRID PRODUCTOS */
        .productos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
        }

        .producto {
            background-color: var(--blanco);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .producto:hover {
            transform: translateY(-8px);
            box-shadow: 0 18px 35px rgba(0,0,0,0.12);
        }

        /* IMAGEN */
        .img-producto {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 15px;
            cursor: zoom-in;
            transition: transform 0.3s;
        }

        .img-producto:hover {
            transform: scale(1.08);
        }

        .producto h3 {
            margin: 10px 0;
            font-size: 16px;
        }

        /* BOTONES */
        .botones {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 110px;
            padding: 12px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            color: var(--blanco);
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .menudeo {
            background: linear-gradient(135deg, #22c55e, #4ade80);
        }

        .mayoreo {
            background: linear-gradient(135deg, #3b82f6, #60a5fa);
        }

        footer {
            margin-top: 60px;
            text-align: center;
            padding: 25px;
            font-size: 14px;
            color: #6b7280;
        }
    </style>
</head>
<body>
